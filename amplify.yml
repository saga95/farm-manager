version: 1
# Two environments only: `development` → dev and `main` → prod (docs/ENVIRONMENTS_AND_RELEASES.md).
# Node version is pinned via .nvmrc (Node 20); aws-cdk-lib requires Node >= 20.
#
# Memory: the Standard build container (8 GiB) ran out of memory during `next build`.
# Node's heap is capped, and next.config.mjs uses a single worker on Amplify.
# pnpm's content-addressed store is cached instead of node_modules (a large symlink farm).
backend:
  phases:
    build:
      commands:
        - npm install -g pnpm@9
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
        - pnpm exec ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@9
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
    build:
      commands:
        # grep exits 1 when no NEXT_PUBLIC_* vars are set — a valid state that
        # must not abort the build under `set -e`.
        - (env | grep -e NEXT_PUBLIC_ >> .env.production) || true
        # Expose the Amplify branch so src/lib/env.ts can tell dev (development) from prod (main).
        - echo "NEXT_PUBLIC_AWS_BRANCH=$AWS_BRANCH" >> .env.production
        - NODE_OPTIONS=--max-old-space-size=3072 pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
      - .next/cache/**/*
