# Signed-in E2E against the LIVE dev environment (#128).
# Not a merge gate: dev deploys after merge (baseline rule,
# docs/ENVIRONMENTS_AND_RELEASES.md). Runs nightly and on demand, in the test
# accounts' own farms. Skips everything when the secrets aren't set.
name: E2E (dev live)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *' # 03:00 Asia/Colombo, after the day's deploys

concurrency:
  group: e2e-dev-live
  cancel-in-progress: false

jobs:
  dev-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_DEV_EMAIL: ${{ secrets.E2E_DEV_EMAIL }}
      E2E_DEV_PASSWORD: ${{ secrets.E2E_DEV_PASSWORD }}
      E2E_DEV_EMAIL_B: ${{ secrets.E2E_DEV_EMAIL_B }}
      E2E_DEV_PASSWORD_B: ${{ secrets.E2E_DEV_PASSWORD_B }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-live
          path: playwright-report-live
          retention-days: 14
